<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Georgia, serif;
  color: #9d416b;
  text-align: center;
  background: linear-gradient(135deg,#fff8fc,#ffe0ef,#fff);
  overflow-x: hidden;
}

.screen {
  display: none;
  min-height: 100vh;
  padding: 30px 18px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.screen.active {
  display: flex;
  animation: appear .6s ease;
}

.card {
  background: #ffffffed;
  border: 1px solid #ffd0e4;
  border-radius: 25px;
  padding: 25px 20px;
  width: min(100%,430px);
  box-shadow: 0 10px 35px #d95b9020;
}

h1 { font-size: clamp(30px,8vw,44px); }
h2 { font-size: 27px; }

p {
  font-size: 18px;
  line-height: 1.7;
}

button {
  background: linear-gradient(135deg,#ff8fbd,#f05b9a);
  color: white;
  border: none;
  border-radius: 30px;
  padding: 14px 23px;
  font-size: 16px;
  margin: 9px 5px;
  cursor: pointer;
  box-shadow: 0 5px 18px #f6a7cb77;
}

button:active { transform: scale(.96); }

.small { font-size: 13px; color: #aa6885; }

.photo {
  width: 100%;
  max-height: 350px;
  object-fit: contain;
  border-radius: 18px;
  margin: 12px 0;
}

input[type="file"] {
  width: 100%;
  margin: 12px 0;
  font-size: 14px;
}

textarea {
  width: 100%;
  min-height: 180px;
  padding: 13px;
  border: 1px solid #f4a5c9;
  border-radius: 12px;
  margin: 10px 0;
  font: inherit;
  color: #87395e;
  resize: vertical;
}

#envelope {
  font-size: 90px;
  cursor: pointer;
  animation: pulse 1.5s infinite;
}

#letterResult {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  text-align: left;
}

.heart {
  position: fixed;
  bottom: -30px;
  pointer-events: none;
  animation: floatUp 7s linear forwards;
  z-index: 5;
}

  to { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
}
